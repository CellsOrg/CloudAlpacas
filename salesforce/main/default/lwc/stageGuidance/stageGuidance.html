<template>
    <template lwc:if={showBrief}>
    <article class="guidance-card" aria-label="Stage Guidance">
        <header class="guidance-head">
            <span class="guidance-mark" aria-hidden="true">✦</span>
            <h2>{title}</h2>
        </header>

        <template lwc:if={hasContext}>
            <template lwc:if={loading}>
                <p class="guidance-empty">Opportunity Agent가 현재 딜을 분석하고 있습니다</p>
            </template>
            <template lwc:elseif={hasRecommendation}>
                <template lwc:if={isNegotiation}>
                    <section class="brief-section brief-section_full negotiation-context">
                        <div class="section-heading">
                            <h3>협상 컨텍스트</h3>
                            <span class="info-wrap">
                                <button class="info-button" type="button" aria-label="협상 컨텍스트 안내">ⓘ</button>
                                <span class="info-tooltip" role="tooltip">현재 Quote, 고객 예산, 할인, 유효기한 등 협상 사실 요약</span>
                            </span>
                        </div>
                        <template lwc:if={hasNegotiationContext}>
                            <dl class="metric-grid">
                                <template for:each={negotiationMetrics} for:item="metric">
                                    <div class={metric.className} key={metric.key}>
                                        <dt>{metric.label}</dt>
                                        <dd>
                                            <lightning-formatted-number lwc:if={metric.isCurrency} value={metric.value} format-style="currency" currency-code="KRW" currency-display-as="symbol"></lightning-formatted-number>
                                            <lightning-formatted-date-time lwc:elseif={metric.isDate} value={metric.value} year="numeric" month="2-digit" day="2-digit"></lightning-formatted-date-time>
                                            <span lwc:else>{metric.value}</span>
                                        </dd>
                                    </div>
                                </template>
                            </dl>
                        </template>
                        <template lwc:else><p class="section-empty">협상 컨텍스트 정보 없음</p></template>
                    </section>
                </template>

                <section class="brief-grid">
                    <template for:each={recommendationSections} for:item="section">
                        <section class={section.className} key={section.key}>
                            <div class="section-heading">
                                <template lwc:if={section.hasIcon}><span class="section-icon" aria-hidden="true">{section.icon}</span></template>
                                <h3>{section.title}</h3>
                                <template lwc:if={section.infoText}>
                                    <span class="info-wrap">
                                        <button class="info-button" type="button" aria-label={section.infoLabel}>ⓘ</button>
                                        <span class="info-tooltip" role="tooltip">{section.infoText}</span>
                                    </span>
                                </template>
                            </div>
                            <ul class="guidance-list">
                                <template for:each={section.lines} for:item="line"><li class={line.className} key={line.key}>{line.text}</li></template>
                            </ul>
                        </section>
                    </template>
                </section>
            </template>

            <template lwc:if={error}>
                <p class="guidance-error">{errorMessage}<lightning-button variant="base" label="다시 시도" onclick={retry}></lightning-button></p>
            </template>
            <template lwc:if={showFallbackFacts}>
                <section class="brief-section brief-section_full">
                    <div class="section-heading"><h3>현재 확인된 정보</h3></div>
                    <ul class="fact-list">
                        <template for:each={facts} for:item="fact">
                            <li key={fact.label}>
                                <span>{fact.label}</span>
                                <lightning-formatted-number lwc:if={fact.isCurrency} value={fact.value} format-style="currency" currency-code="KRW"></lightning-formatted-number>
                                <lightning-formatted-date-time lwc:elseif={fact.isDate} value={fact.value} year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                                <strong lwc:else>{fact.value}</strong>
                            </li>
                        </template>
                    </ul>
                </section>
                <section class="brief-section brief-section_full">
                    <div class="section-heading"><h3>Recommended Next Action</h3></div>
                    <p class="guidance-next">{action}</p>
                </section>
            </template>
        </template>
        <template lwc:else><p class="guidance-empty">Stage Guidance를 불러올 수 없습니다. 페이지를 새로고침한 뒤 다시 확인하세요</p></template>
    </article>
    </template>
</template>
