<template>
    <!-- No card title: the FlexiPage tab ("Interactions") is the section header. -->
    <lightning-card>
        <div class="activity-timeline slds-p-horizontal_small slds-p-vertical_small">
            <!-- Quick Action Bar — Salesforce standard composers -->
            <div class="activity-timeline__actionbar" role="group" aria-label="빠른 작업">
                <template for:each={quickActions} for:item="qa">
                    <lightning-button
                        key={qa.name}
                        class="activity-timeline__action"
                        label={qa.label}
                        icon-name={qa.icon}
                        variant="neutral"
                        data-name={qa.name}
                        onclick={handleQuickAction}
                    ></lightning-button>
                </template>
            </div>

            <template if:true={hasError}>
                <p class="slds-text-body_small slds-text-color_error slds-p-vertical_small">
                    상호작용 내역을 불러오지 못했습니다.
                </p>
            </template>

            <template if:false={hasError}>
                <template if:false={hasItems}>
                    <p class="slds-text-body_small slds-text-color_weak slds-p-vertical_small">
                        이 Opportunity에 표시할 상호작용 기록이 없습니다.
                    </p>
                </template>

                <template if:true={hasItems}>
                    <ul class="activity-timeline__list">
                        <template for:each={rows} for:item="row">
                            <li key={row.key} class={row.itemClass}>
                                <span class="activity-timeline__node">
                                    <lightning-icon icon-name={row.iconName} size="small"></lightning-icon>
                                </span>

                                <div class="activity-timeline__body">
                                    <!-- collapsed header (clickable) -->
                                    <div
                                        class="activity-timeline__header"
                                        data-id={row.activityId}
                                        onclick={handleToggle}
                                        role="button"
                                        tabindex="0"
                                    >
                                        <div class="activity-timeline__headline">
                                            <span class="activity-timeline__subject" title={row.subject}>
                                                {row.subject}
                                            </span>
                                            <span class="activity-timeline__datetime">{row.timestampDisplay}</span>
                                        </div>
                                        <lightning-icon
                                            icon-name={row.toggleIcon}
                                            size="x-small"
                                            alternative-text={row.toggleLabel}
                                            class="activity-timeline__toggle"
                                        ></lightning-icon>
                                    </div>

                                    <!-- collapsed intelligence preview -->
                                    <template if:true={row.hasIntelligence}>
                                        <template if:true={row.summary}>
                                            <p class="activity-timeline__summary">{row.summary}</p>
                                        </template>
                                        <div class="activity-timeline__badges">
                                            <template if:true={row.hasReaction}>
                                                <span class={row.reactionBadgeClass}>{row.customerReaction}</span>
                                            </template>
                                            <template for:each={row.collapsedSignals} for:item="sig">
                                                <span key={sig.key} class="slds-badge" title={sig.evidence}
                                                    >{sig.category}</span
                                                >
                                            </template>
                                            <template if:true={row.hasExtraSignals}>
                                                <span class="slds-badge slds-badge_lightest"
                                                    >{row.extraSignalLabel}</span
                                                >
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={row.hasIntelligence}>
                                        <p class="activity-timeline__no-intel">AI 분석 없음</p>
                                    </template>

                                    <!-- expanded detail -->
                                    <template if:true={row.showDetail}>
                                        <div class="activity-timeline__detail">
                                            <!-- Activity Information -->
                                            <section class="activity-timeline__section">
                                                <h3 class="activity-timeline__section-heading">Activity Information</h3>
                                                <div class="activity-timeline__info">
                                                    <div class="activity-timeline__info-row">
                                                        <span class="activity-timeline__info-label">Type</span>
                                                        <span class="activity-timeline__info-value">{row.typeLabel}</span>
                                                    </div>
                                                    <div class="activity-timeline__info-row">
                                                        <span class="activity-timeline__info-label">Date</span>
                                                        <span class="activity-timeline__info-value">
                                                            {row.timestampDisplay}
                                                            <template if:true={row.contentEndDisplay}>
                                                                – {row.contentEndDisplay}</template
                                                            >
                                                        </span>
                                                    </div>
                                                    <div class="activity-timeline__info-row">
                                                        <span class="activity-timeline__info-label">Subject</span>
                                                        <span class="activity-timeline__info-value">{row.subject}</span>
                                                    </div>
                                                    <template if:true={row.hasContact}>
                                                        <div class="activity-timeline__info-row">
                                                            <span class="activity-timeline__info-label">Contact</span>
                                                            <span class="activity-timeline__info-value">{row.contactName}</span>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.ownerName}>
                                                        <div class="activity-timeline__info-row">
                                                            <span class="activity-timeline__info-label">Owner</span>
                                                            <span class="activity-timeline__info-value">{row.ownerName}</span>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.status}>
                                                        <div class="activity-timeline__info-row">
                                                            <span class="activity-timeline__info-label">Status</span>
                                                            <span class="activity-timeline__info-value">{row.status}</span>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.meetingType}>
                                                        <div class="activity-timeline__info-row">
                                                            <span class="activity-timeline__info-label">Meeting Type</span>
                                                            <span class="activity-timeline__info-value">{row.meetingType}</span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </section>

                                            <!-- Intelligence -->
                                            <section class="activity-timeline__section">
                                                <h3 class="activity-timeline__section-heading">Intelligence</h3>
                                                <template if:true={row.hasIntelligence}>
                                                    <template if:true={row.summary}>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">Summary</p>
                                                            <p class="activity-timeline__field-value">{row.summary}</p>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.hasReaction}>
                                                        <div
                                                            class="activity-timeline__field activity-timeline__field_inline"
                                                        >
                                                            <span class="activity-timeline__field-label"
                                                                >Customer Reaction</span
                                                            >
                                                            <span class={row.reactionBadgeClass}
                                                                >{row.customerReaction}</span
                                                            >
                                                        </div>
                                                    </template>
                                                    <template if:true={row.hasKeyDecision}>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">Key Decision</p>
                                                            <p class="activity-timeline__field-value">{row.keyDecision}</p>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.hasConcerns}>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">
                                                                Concerns / Objections
                                                            </p>
                                                            <p class="activity-timeline__field-value">
                                                                {row.concernsObjections}
                                                            </p>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.hasFollowUp}>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">Follow-up</p>
                                                            <p class="activity-timeline__field-value">{row.followUp}</p>
                                                        </div>
                                                    </template>
                                                </template>
                                                <template if:false={row.hasIntelligence}>
                                                    <p
                                                        class="activity-timeline__field-value activity-timeline__muted"
                                                    >
                                                        이 활동에 대한 AI 분석이 아직 없습니다.
                                                    </p>
                                                </template>
                                            </section>

                                            <!-- Signals -->
                                            <template if:true={row.hasCollapsedSignals}>
                                                <section class="activity-timeline__section">
                                                    <h3 class="activity-timeline__section-heading">Signals</h3>
                                                    <template for:each={row.allSignals} for:item="sig">
                                                        <div key={sig.key} class="activity-timeline__signal">
                                                            <div class="activity-timeline__signal-badges">
                                                                <span class="slds-badge">{sig.category}</span>
                                                                <span class={sig.directionBadgeClass}
                                                                    >{sig.direction}</span
                                                                >
                                                                <span class="slds-badge slds-badge_lightest"
                                                                    >{sig.confidence}</span
                                                                >
                                                            </div>
                                                            <template if:true={sig.hasType}>
                                                                <p class="activity-timeline__signal-type">{sig.type}</p>
                                                            </template>
                                                            <template if:true={sig.hasEvidence}>
                                                                <p class="activity-timeline__signal-evidence">
                                                                    “{sig.evidence}”
                                                                </p>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </section>
                                            </template>

                                            <!-- Content: Meeting Notes / Activity Notes / Email Content -->
                                            <section class="activity-timeline__section">
                                                <h3 class="activity-timeline__section-heading">
                                                    <template if:true={row.content}>{row.content.contentType}</template>
                                                    <template if:false={row.content}>{row.contentType}</template>
                                                </h3>
                                                <template if:true={row.loadingContent}>
                                                    <lightning-spinner
                                                        size="x-small"
                                                        alternative-text="불러오는 중"
                                                    ></lightning-spinner>
                                                </template>
                                                <template if:true={row.content}>
                                                    <template if:true={row.contentHasEmailMeta}>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">From</p>
                                                            <p class="activity-timeline__field-value">
                                                                {row.content.emailFrom}
                                                            </p>
                                                        </div>
                                                        <div class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">To</p>
                                                            <p class="activity-timeline__field-value">
                                                                {row.content.emailTo}
                                                            </p>
                                                        </div>
                                                        <template if:true={row.content.emailCc}>
                                                            <div class="activity-timeline__field">
                                                                <p class="activity-timeline__field-label">Cc</p>
                                                                <p class="activity-timeline__field-value">
                                                                    {row.content.emailCc}
                                                                </p>
                                                            </div>
                                                        </template>
                                                    </template>
                                                    <template if:true={row.content.body}>
                                                        <p class="activity-timeline__content-body">{row.content.body}</p>
                                                    </template>
                                                    <template for:each={row.contentMeetingNotes} for:item="note">
                                                        <div key={note.key} class="activity-timeline__field">
                                                            <p class="activity-timeline__field-label">{note.label}</p>
                                                            <p class="activity-timeline__field-value">{note.value}</p>
                                                        </div>
                                                    </template>
                                                    <template if:true={row.noContent}>
                                                        <p
                                                            class="activity-timeline__field-value activity-timeline__muted"
                                                        >
                                                            저장된 원본 내용이 없습니다.
                                                        </p>
                                                    </template>
                                                </template>
                                            </section>
                                        </div>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
