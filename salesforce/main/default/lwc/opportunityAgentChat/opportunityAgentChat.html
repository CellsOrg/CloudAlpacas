<template>
    <lightning-card title="Opportunity Agent" icon-name="utility:agent_astro">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <p class="slds-text-body_regular slds-var-m-bottom_x-small">무엇이든 도와드립니다!</p>

            <div class="composer slds-grid slds-grid_vertical-align-end">
                <lightning-input
                    class="slds-col slds-grow"
                    type="text"
                    variant="label-hidden"
                    label="Opportunity Agent에게 질문하기"
                    placeholder="Opportunity Agent에게 질문하기..."
                    value={draft}
                    onchange={handleDraft}
                    onkeydown={handleComposerKey}
                ></lightning-input>
                <lightning-button-icon
                    class="slds-col slds-shrink-none slds-var-m-left_xx-small"
                    icon-name="utility:send"
                    variant="brand"
                    alternative-text="질문 전송"
                    title="질문 전송"
                    onclick={handleAsk}
                    disabled={sendDisabled}
                ></lightning-button-icon>
            </div>

            <div class="slds-var-m-top_small">
                <lightning-button
                    variant="base"
                    label="이전 대화 기록 보기"
                    icon-name="utility:comments"
                    onclick={handleOpenHistory}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>

    <template lwc:if={modalOpen}>
        <c-opportunity-agent-chat-modal
            opportunity-name={opportunityName}
            view={modalView}
            conversations={conversations}
            active-conversation={activeConversation}
            search-term={searchTerm}
            busy={busy}
            onclose={handleModalClose}
            onback={handleModalBack}
            onopenconversation={handleModalOpenConversation}
            onnewconversation={handleModalNewConversation}
            onsearch={handleModalSearch}
            onsend={handleModalSend}
        ></c-opportunity-agent-chat-modal>
    </template>
</template>
